name: Refresh Construction Edge articles
on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/journal-sync.yml']
permissions:
  contents: write
concurrency:
  group: construction-edge-journal-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch, validate and save the public article feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, datetime, email.utils, json, os, sys, time, urllib.request, urllib.error, subprocess, tempfile
          import xml.etree.ElementTree as ET
          
          REPO = os.environ['GITHUB_REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          BRANCH = 'journal-feed'
          PATH = 'journal.json'
          FEED = 'https://theconstructionedge.substack.com/feed'
          LIMIT = 3 * 1024 * 1024
          
          
          def api(path, method='GET', body=None):
              req = urllib.request.Request('https://api.github.com/repos/' + REPO + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Construction-Edge-Journal-Sync'}, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          
          
          def validate(xml):
              if '<!DOCTYPE' in xml.upper() or '<!ENTITY' in xml.upper():
                  raise ValueError('Unexpected XML declarations')
              root = ET.fromstring(xml)
              channel = root.find('channel')
              if root.tag != 'rss' or channel is None or (channel.findtext('link') or '').rstrip('/') != 'https://theconstructionedge.substack.com':
                  raise ValueError('Unexpected publication')
              items = channel.findall('item')
              if not items:
                  raise ValueError('Refusing to replace published articles with an empty feed')
              for item in items:
                  link = urllib.parse.urlparse(item.findtext('link') or '')
                  if not item.findtext('title') or link.scheme != 'https' or link.netloc != 'theconstructionedge.substack.com' or not link.path.startswith('/p/'):
                      raise ValueError('Invalid article')
              return len(items)
          
          
          def save(snapshot, sha):
              body = {'message': 'Refresh published Construction Edge articles', 'branch': BRANCH,
                      'content': base64.b64encode(json.dumps(snapshot, ensure_ascii=False).encode()).decode()}
              if sha:
                  body['sha'] = sha
              api('/contents/' + PATH, 'PUT', body)
          
          
          def main():
              try:
                  api('/git/ref/heads/' + BRANCH)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  source = api('/git/ref/heads/main')
                  api('/git/refs', 'POST', {'ref': 'refs/heads/' + BRANCH, 'sha': source['object']['sha']})
              previous, sha = {}, None
              try:
                  existing = api('/contents/' + PATH + '?ref=' + BRANCH)
                  sha = existing['sha']
                  previous = json.loads(base64.b64decode(existing['content']))
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              now = int(time.time() * 1000)
              if previous.get('nextAttemptAt', 0) > now:
                  print('Waiting until the upstream retry window ends; existing articles retained.')
                  return
              try:
                  with tempfile.TemporaryDirectory() as temp:
                      result = subprocess.run(['curl', '--silent', '--show-error', '--max-time', '30',
                          '--max-filesize', str(LIMIT), '--dump-header', temp + '/headers',
                          '--output', temp + '/feed', '--write-out', '%{http_code}', FEED], capture_output=True, text=True)
                      status = int(result.stdout) if result.stdout.isdigit() else 0
                      if result.returncode != 0 or status != 200:
                          from email.parser import Parser
                          headers = Parser().parsestr(open(temp + '/headers').read().split('\n', 1)[-1])
                          print('RSS response status:', status, 'challenge:', headers.get('cf-mitigated', 'none'))
                          raise urllib.error.HTTPError(FEED, status, 'RSS request failed', headers, None)
                      with open(temp + '/feed', encoding='utf-8') as feed:
                          xml = feed.read(LIMIT + 1)
                      if len(xml.encode()) > LIMIT:
                          raise ValueError('Feed exceeds size limit')
                  count = validate(xml)
                  save({'xml': xml, 'fetchedAt': now, 'count': count, 'failures': 0}, sha)
                  print(f'Published a validated snapshot containing {count} articles.')
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError, ET.ParseError) as error:
                  failures = previous.get('failures', 0) + 1
                  delay = min(6 * 3600, 1800 * 2 ** min(failures - 1, 4))
                  retry_after = error.headers.get('Retry-After') if isinstance(error, urllib.error.HTTPError) else None
                  if retry_after:
                      try:
                          retry = float(retry_after) if retry_after.isdigit() else email.utils.parsedate_to_datetime(retry_after).timestamp() - time.time()
                          delay = max(delay, retry)
                      except (ValueError, TypeError):
                          pass
                  previous.update({'failures': failures, 'nextAttemptAt': now + int(delay * 1000)})
                  save(previous, sha)
                  print('Refresh failed; previous articles retained. ' + type(error).__name__, file=sys.stderr)
                  raise
          
          
          if __name__ == '__main__':
              main()
          PYTHON
