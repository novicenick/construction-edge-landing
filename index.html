<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Edge Advisory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #00A67E;    /* Professional green */
            --color-secondary: #1B365D;  /* Deep navy */
            --color-background: #F5F5F5; /* Light grey */
            --color-text: #333333;       /* Dark grey */
        }
        
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--color-background);
            color: var(--color-text);
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .logo {
            max-width: 600px;
            margin: 0 auto 2rem;
        }
        
        .logo svg {
            width: 100%;
            height: auto;
        }
        
        .content {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 2rem;
        }
        
        h1 {
            font-size: 2.5rem;
            color: var(--color-secondary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        .status {
            font-size: 2rem;
            color: var(--color-primary);
            margin: 2rem 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .footer {
            text-align: center;
            padding: 1rem;
            color: var(--color-text);
            font-size: 0.875rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
                <circle cx="150" cy="150" r="120" fill="#00A67E"/>
                <text x="194" y="134" font-family="Inter" font-size="86" fill="#1B365D">CE</text>
                <text x="194" y="210" font-family="Inter" font-size="58" fill="#1B365D">Advisory</text>
            </svg>
        </div>
        <div class="content">
            <h1>Construction Edge</h1>
            <div class="status">Returning Soon</div>
        </div>
    </div>
    <div class="footer">
        © 2025 Construction Edge Advisory - All rights reserved
    </div>
</body>
</html>
